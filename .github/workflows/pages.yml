# Publishes the static review copy in preview/ (built from the Odoo templates
# with tools/export_static.py) to GitHub Pages. The Odoo addon itself is not
# deployed by this workflow.
name: Publish test preview

on:
  push:
    branches: [main]
    paths: ["preview/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4
